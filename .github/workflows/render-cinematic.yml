name: Probar render cinematografico 3D
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-cinematic.yml'
      - 'src/cinematic.tsx'
      - 'src/original-music.ts'
  workflow_dispatch:
jobs:
  cinematic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Instalar navegador
        run: npx remotion browser ensure
      - name: Renderizar video 3D
        run: mkdir -p out && npx remotion render src/index.ts Cinematic out/cinematic.mp4 --codec=h264 --crf=18 --concurrency=2
      - name: Comprobar archivo y pistas multimedia
        if: always()
        run: |
          if [ ! -s out/cinematic.mp4 ]; then
            echo "::error::El archivo MP4 no existe o esta vacio"
            exit 1
          fi
          ffprobe -v error -show_format -show_streams out/cinematic.mp4
          VIDEO_CODEC=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 out/cinematic.mp4)
          AUDIO_CODEC=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 out/cinematic.mp4)
          echo "Video: ${VIDEO_CODEC}; audio: ${AUDIO_CODEC:-ninguno}"
          test "$VIDEO_CODEC" = "h264"
          if [ -z "$AUDIO_CODEC" ]; then
            echo "::warning::El MP4 se genero sin audio; se entregara para inspeccion."
          elif [ "$AUDIO_CODEC" != "aac" ]; then
            echo "::warning::El audio no esta codificado en AAC."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-video-factory-cinematic-3d
          path: out/cinematic.mp4
          if-no-files-found: error
          retention-days: 7
