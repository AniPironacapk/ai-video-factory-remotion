name: Probar render cinematografico 3D
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-cinematic.yml'
      - 'src/cinematic.tsx'
      - 'src/original-music.ts'
  workflow_dispatch:
jobs:
  cinematic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Instalar navegador
        run: npx remotion browser ensure
      - name: Renderizar video 3D
        run: mkdir -p out && npx remotion render src/index.ts Cinematic out/cinematic.mp4 --codec=h264 --crf=18 --concurrency=2
      - name: Subir MP4 renderizado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-factory-cinematic-3d
          path: out/cinematic.mp4
          if-no-files-found: warn
          retention-days: 7
      - name: Diagnóstico multimedia sin bloquear entrega
        if: always()
        shell: bash
        run: |
          if [ ! -s out/cinematic.mp4 ]; then
            echo "::warning::No existe un MP4 renderizado."
            exit 0
          fi
          ls -lh out/cinematic.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name,width,height -of json out/cinematic.mp4 || true
          echo "El MP4 se ha subido en el paso anterior. Las pistas ausentes son informativas."

