name: Renderizar video MP4

on:
  push:
    branches: [main]
    paths:
      - 'video-request.json'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/render-video.yml'
  workflow_dispatch:

concurrency:
  group: render-video
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Preparar navegador de Remotion
        run: npx remotion browser ensure
      - name: Validar solicitud
        run: |
          python3 - <<'PY'
          import json
          with open('video-request.json', encoding='utf-8') as f:
              data = json.load(f)
          assert isinstance(data.get('scenes'), list) and data['scenes'], 'Se requiere al menos una escena'
          assert all(isinstance(s.get('title'), str) and isinstance(s.get('subtitle'), str) for s in data['scenes'])
          print(f"Video con {len(data['scenes'])} escenas")
          PY
      - name: Renderizar MP4
        run: mkdir -p out && npx remotion render src/index.ts Video out/video.mp4 --codec=h264
      - name: Guardar video para descargar
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-factory-mp4
          path: out/video.mp4
          if-no-files-found: error
          retention-days: 7
