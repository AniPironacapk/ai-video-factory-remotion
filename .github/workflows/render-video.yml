name: Renderizar video MP4

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Título del video'
        required: true
        default: 'AI VIDEO FACTORY'
        type: string
      subtitle:
        description: 'Subtítulo'
        required: true
        default: 'Tu historia cobra vida'
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Preparar navegador de Remotion
        run: npx remotion browser ensure
      - name: Crear propiedades del video
        env:
          VIDEO_TITLE: ${{ inputs.title }}
          VIDEO_SUBTITLE: ${{ inputs.subtitle }}
        run: |
          python3 - <<'PY'
          import json, os
          with open('video-props.json', 'w', encoding='utf-8') as f:
              json.dump({'title': os.environ['VIDEO_TITLE'], 'subtitle': os.environ['VIDEO_SUBTITLE'], 'accent': '#7c3aed'}, f, ensure_ascii=False)
          PY
      - name: Renderizar MP4
        run: npx remotion render src/index.ts Video out/video.mp4 --props=video-props.json --codec=h264
      - name: Guardar video para descargar
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-factory-mp4
          path: out/video.mp4
          retention-days: 7
